name: CI

# Runs on every PR to master (each job is a required status check in the
# master ruleset — see .github/rulesets/master.json) and on pushes to
# master/beta, which the deploy and beta-migration workflows wait for.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master, beta]

permissions:
  contents: read

# Release PRs (release-please--…) only bump the version and the CHANGELOG:
# every job is skipped there, which counts as passing for required checks.
# Pushes to master still run everything (the deploy waits for this run).

# A new push to the same PR cancels the run that became outdated.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Release notes and the next version come from the commit subjects
  # (Conventional Commits: feat, fix, refactor…), so a PR must follow them.
  commits:
    name: commits
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Conventional Commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|perf|refactor|revert|docs|test|build|ci|chore|style)(\([a-z0-9-]+\))?!?: .+'
          bad=$(git log --no-merges --format='%s' "$BASE_SHA..$HEAD_SHA" | grep -Ev "$pattern" || true)
          if [ -n "$bad" ]; then
            echo "These commit subjects don't follow Conventional Commits (type: summary):"
            echo "$bad"
            exit 1
          fi

  format:
    name: format
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prettier
        run: npx prettier --check .

  lint:
    name: lint
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint (includes the layer rules)
        run: npm run lint:check

  typecheck:
    name: typecheck
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: test
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: build
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  schema:
    name: schema
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: schema.gql up to date with the resolvers
        run: npm run schema:check
