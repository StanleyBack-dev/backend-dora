  lastReceivedOn: String

  """Do mais recente ao mais antigo."""
  history: [SupportContribution!]!
}

type SystemLogSummary {
  level: String!
  last24h: Int!
  last7d: Int!
}

"""Registro do log do sistema."""
type SystemLog {
  id: ID!

  """INFO, WARN, ERROR ou CRITICAL."""
  level: String!

  """API, DATABASE, AUTH, SECURITY, OUTBOX, ROUTINE…"""
  category: String!
  source: String!
  message: String!
  details: JSON
  userId: ID
  userName: String
  ip: String
  statusCode: Int
  durationMs: Int
  environment: String!
  createdAt: DateTime!
}

"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf).
"""
scalar JSON

type SystemLogPage {
  items: [SystemLog!]!
  total: Int!
  page: Int!
  limit: Int!
  totalPages: Int!
}

type Query {
  """Verifica se a API GraphQL responde."""
  ping: String!

  """Versão e commit da API em execução."""
  appInfo: AppInfo!

  """
  Criação e última alteração de um registro (null: não existe ou é de outro condomínio). Contas e cadastros só para quem gerencia usuários.
  """
  recordStamp(entity: String!, id: ID!): RecordStamp

  """Taxas de uso de um mês (padrão: o atual), por unidade."""
  bookingFees(
    """YYYY-MM."""
    month: String
  ): BookingFees!

  """Convidados de uma reserva (sua, ou qualquer para gestores)."""
  bookingGuests(bookingId: ID!): [BookingGuest!]!

  """Minhas reservas."""
  myBookings(when: BookingWhen! = UPCOMING, page: PageInput): BookingPage!

  """Todas as reservas do condomínio."""
  bookings(filter: BookingFilterInput, page: PageInput): BookingPage!

  """Convidados das reservas de um dia (padrão: hoje)."""
  gateGuests(
    """YYYY-MM-DD."""
    date: String
  ): [GateGuest!]!

  """Convite de um convidado pelo código (null: não existe)."""
  guestInvite(code: String!): GuestInvite

  """A grade de horários de um espaço em um dia."""
  spaceAvailability(
    spaceId: ID!

    """YYYY-MM-DD."""
    date: String!
  ): SpaceAvailability!

  """Bloqueios atuais e futuros do espaço."""
  spaceBlocks(spaceId: ID!): [SpaceBlock!]!

  """Últimos 50 comunicados."""
  broadcasts: [Broadcast!]!
  condominiums(filter: CondominiumFilterInput): [Condominium!]!
  condominium(id: ID!): Condominium!

  """Unidades do condomínio atual."""
  units: [Unit!]!
  dashboard: Dashboard!
  enrollmentInvites: [EnrollmentInvite!]!
  enrollmentRequests(filter: EnrollmentRequestFilterInput, page: PageInput): EnrollmentRequestPage!

  """Cadastros aguardando aprovação."""
  pendingEnrollmentCount: Int!
  enrollmentRequest(id: ID!): EnrollmentRequest!

  """
  Confere se o token do formulário ainda vale e diz o condomínio e as unidades.
  """
  enrollmentForm(formToken: String!): EnrollmentForm!
  me: SessionUser!

  """Membros do condomínio."""
  users(filter: UserFilterInput, page: PageInput): UserAccountPage!
  user(id: ID!): UserAccount!
  userPermissions(id: ID!): PermissionMatrix!

  """Mais recentes primeiro."""
  myNotifications(unreadOnly: Boolean! = false, page: PageInput): NotificationPage!
  unreadNotificationsCount: Int!
  myNotificationPreferences: [NotificationPreference!]!

  """Chave VAPID para o navegador assinar o push (null = desligado)."""
  pushPublicKey: String

  """
  Números da plataforma no período: reservas, uso dos espaços, moradores e o que precisa de atenção.
  """
  platformMetrics(filter: PlatformMetricsFilterInput): PlatformMetrics!

  """
  Espaços do condomínio atual. Inativos só com includeInactive, para quem gerencia espaços.
  """
  spaces(includeInactive: Boolean! = false): [Space!]!
  space(id: ID!): Space!

  """Quantas solicitações de suporte ainda posso enviar hoje."""
  supportQuota: SupportQuota!

  """Minhas solicitações de suporte, das mais recentes."""
  mySupportRequests(page: PageInput): SupportRequestPage!

  """Todas as solicitações de suporte (administração)."""
  supportRequests(status: SupportStatus, page: PageInput): SupportRequestPage!

  """Ranking de quem apoia o Dora: geral ou de um ano."""
  supportRanking(year: Int): SupportRanking!

  """Todos os apoiadores, com cada apoio (administração)."""
  supporters: [Supporter!]!

  """Log do sistema (administração), do mais recente."""
  systemLogs(filter: SystemLogFilterInput, page: PageInput): SystemLogPage!

  """Quantos registros por nível nas últimas 24 h e 7 dias."""
  systemLogSummary: [SystemLogSummary!]!
}

"""Próximas (ainda não terminaram) ou passadas."""
enum BookingWhen {
  UPCOMING
  PAST
}

input PageInput {
  page: Int! = 1
  limit: Int! = 20
}

input BookingFilterInput {
  spaceId: ID
  status: BookingStatus
  when: BookingWhen
}

input CondominiumFilterInput {
  search: String
  status: CondominiumStatus
}

input EnrollmentRequestFilterInput {
  status: EnrollmentStatus
  search: String
}

input UserFilterInput {
  search: String
  group: UserGroup

  """Qualquer um destes papéis (ex.: a equipe, ADMIN e CONCIERGE)."""
  groups: [UserGroup!]
  active: Boolean
  unitId: ID
}

input PlatformMetricsFilterInput {
  """Primeiro dia (YYYY-MM-DD). Padrão: 30 dias antes do fim."""
  from: String

  """Último dia (YYYY-MM-DD). Padrão: hoje."""
  to: String

  """Um condomínio (vazio: todos)."""
  condominiumId: ID
}

input SystemLogFilterInput {
  from: DateTime
  to: DateTime
  levels: [String!]
  categories: [String!]
  search: String
  environment: String
}

type Mutation {
  """
  Marca (ou desmarca) taxas como lançadas na cobrança; devolve quantas mudaram.
  """
  setBookingFeesBilled(input: SetBookingFeesBilledInput!): Int!

  """Adiciona convidados à reserva; cada um recebe o código do convite."""
  addBookingGuests(input: AddBookingGuestsInput!): [BookingGuest!]!

  """Tira um convidado da lista (o convite deixa de valer)."""
  removeBookingGuest(id: ID!): Boolean!

  """
  Reserva o mesmo horário toda semana; datas que não puderem ser reservadas são puladas.
  """
  createBookingSeries(input: CreateBookingSeriesInput!): BookingSeriesResult!

  """
  Cancela as próximas datas de uma reserva recorrente (as fora do prazo ficam, para moradores).
  """
  cancelBookingSeries(seriesId: ID!): SeriesCancellation!

  """
  Entra na lista de espera de um horário reservado: se for liberado, você é avisado.
  """
  joinWaitlist(input: WaitlistSlotInput!): Boolean!

  """Sai da lista de espera."""
  leaveWaitlist(input: WaitlistSlotInput!): Boolean!

  """
  Reserva um horário. Confirmada na hora, ou aguardando aprovação quando o espaço exige.
  """
  createBooking(input: CreateBookingInput!): Booking!

  """Cancela a reserva: a sua até o prazo, ou qualquer uma (gestores)."""
  cancelBooking(id: ID!, reason: String): Booking!
  approveBooking(id: ID!): Booking!
  rejectBooking(id: ID!, reason: String!): Booking!

  """Libera a entrada de um convidado (pelo código ou da lista)."""
  checkInGuest(input: CheckInGuestInput!): GateGuest!

  """Desfaz a entrada marcada por engano."""
  undoGuestCheckIn(guestId: ID!): GateGuest!
  createSpaceBlock(input: CreateSpaceBlockInput!): SpaceBlock!
  deleteSpaceBlock(id: ID!): Boolean!
  sendBroadcast(input: BroadcastInput!): Broadcast!
  createCondominium(input: CondominiumInput!): Condominium!
  updateCondominium(id: ID!, input: CondominiumInput!): Condominium!

  """Suspende ou reativa. Suspenso, ninguém trabalha nele."""
  setCondominiumStatus(id: ID!, status: CondominiumStatus!): Condominium!

  """Cria várias unidades de um bloco de uma vez."""
  createUnits(input: CreateUnitsInput!): [Unit!]!
  updateUnit(id: ID!, input: UpdateUnitInput!): Unit!

  """Exclui a unidade (só sem moradores vinculados)."""
  deleteUnit(id: ID!): Boolean!
  createEnrollmentInvite(input: CreateEnrollmentInviteInput!): EnrollmentInvite!
  revokeEnrollmentInvite(id: ID!): EnrollmentInvite!

  """
  Aprova o cadastro (com as correções) e dá acesso ao condomínio: cria a conta, ou vincula a conta que já existe com este e-mail.
  """
  approveEnrollmentRequest(id: ID!, data: EnrollmentDataInput!, group: UserGroup!): EnrollmentApproval!
  rejectEnrollmentRequest(id: ID!, reason: String!): EnrollmentRequest!

  """
  Confere o código de convite e devolve o token do formulário (vale 60 min).
  """
  verifyEnrollmentCode(code: String!): String!

  """Envia o cadastro, que aguarda a aprovação da administração."""
  submitEnrollment(input: SubmitEnrollmentInput!): Boolean!

  """Entra com usuário (ou e-mail) e senha."""
  login(input: LoginInput!): LoginResult!

  """Novo access token a partir do refresh token da sessão."""
  refreshSessionTokens(refreshToken: String!): AuthTokens!

  """Encerra a sessão atual."""
  logout: Boolean!

  """
  Troca a própria senha (inclusive a temporária). Encerra as outras sessões.
  """
  changeMyPassword(input: ChangePasswordInput!): Boolean!
  updateMyProfile(input: UpdateMyProfileInput!): SessionUser!

  """
  Envia um código por e-mail. Sempre responde true, exista ou não o usuário.
  """
  requestPasswordRecovery(login: String!): Boolean!

  """Confere o código e devolve o token para redefinir a senha."""
  verifyPasswordRecoveryCode(input: VerifyRecoveryCodeInput!): String!
  resetPasswordWithRecovery(input: ResetPasswordInput!): Boolean!

  """Marca a apresentação guiada como vista (concluída ou pulada)."""
  completeOnboarding: Boolean!

  """
  Troca o condomínio da sessão. null: sai de todos (visão da plataforma).
  """
  switchCondominium(condominiumId: ID): Boolean!

  """
  Adiciona ao condomínio. Conta nova: senha temporária (também por e-mail). E-mail já cadastrado: só ganha acesso.
  """
  createUser(input: CreateUserInput!): TemporaryAccess!
  updateUser(id: ID!, input: UpdateUserInput!): UserAccount!

  """
  Ativa ou desativa o acesso a este condomínio (a conta e outros condomínios não mudam).
  """
  setUserActive(id: ID!, active: Boolean!): UserAccount!

  """Gera nova senha temporária e encerra as sessões do usuário."""
  resetUserPassword(id: ID!): TemporaryAccess!
  unlockUser(id: ID!): UserAccount!
  revokeUserSessions(id: ID!): UserAccount!
  setUserPermissions(input: SetUserPermissionsInput!): PermissionMatrix!
  markNotificationRead(id: ID!): Boolean!

  """Quantas foram marcadas."""
  markAllNotificationsRead: Int!
  setNotificationPreference(type: NotificationType!, emailEnabled: Boolean!): NotificationPreference!

  """Ativa o push neste aparelho."""
  subscribePush(input: PushSubscriptionInput!): Boolean!

  """Desativa o push neste aparelho."""
  unsubscribePush(endpoint: String!): Boolean!

  """Envia um push de teste; devolve quantos aparelhos receberam."""
  sendTestPush: Int!

  """
  Troca a própria foto de perfil (base64, já reduzida pelo navegador). Devolve o link temporário.
  """
  setMyPhoto(photo: String!): String!

  """Remove a própria foto de perfil."""
  removeMyPhoto: Boolean!
  createSpace(input: SpaceInput!): Space!
  updateSpace(id: ID!, input: SpaceInput!): Space!

  """Ativa ou desativa (manutenção) o espaço."""
  setSpaceActive(id: ID!, active: Boolean!): Space!

  """
  Adiciona uma foto (até 3 por espaço): JPEG, PNG ou WebP em base64, até 1,2 MB.
  """
  addSpacePhoto(spaceId: ID!, photo: String!): Space!
  removeSpacePhoto(spaceId: ID!, photoId: ID!): Space!

  """Exclui o espaço."""
  deleteSpace(id: ID!): Boolean!

  """
  Envia uma solicitação de suporte (até 3 por dia); avisa os administradores.
  """
  sendSupportRequest(input: SupportRequestInput!): SupportRequest!

  """Responde a solicitação; quem pediu é avisado."""
  replySupportRequest(id: ID!, reply: String!): SupportRequest!

  """Finaliza a solicitação; quem pediu é avisado."""
  finalizeSupportRequest(id: ID!): SupportRequest!

  """
  Registra um apoio recebido por Pix. Um nome já cadastrado soma a esse apoiador.
  """
  recordSupportContribution(input: RecordSupportContributionInput!): SupportContribution!

  """Corrige o nome do apoiador ou se ele aparece no ranking."""
  updateSupporter(id: ID!, input: UpdateSupporterInput!): Supporter!

  """Remove o apoiador e todos os apoios dele."""
  deleteSupporter(id: ID!): Boolean!

  """Desfaz um apoio registrado."""
  deleteSupportContribution(id: ID!): Boolean!

  """Erro de tela do app (o frontend avisa para o log do sistema)."""
  reportClientError(message: String!, url: String!, digest: String): Boolean!
}

input SetBookingFeesBilledInput {
  bookingIds: [ID!]!

  """true: lançadas na cobrança; false: desfaz."""
  billed: Boolean!
}

input AddBookingGuestsInput {
  bookingId: ID!
  guests: [GuestInput!]!
}

input GuestInput {
  name: String!

  """Tipo do documento (obrigatório com documento)."""
  documentType: DocumentType

  """CPF (11 números) ou RG (7 a 10: números e um X no fim)."""
  document: String
  phone: String
}

input CreateBookingSeriesInput {
  spaceId: ID!

  """Primeira data: um dos horários da grade."""
  startsAt: DateTime!

  """Quantas semanas (2 a 26)."""
  weeks: Int!

  """Observação (até 300)."""
  notes: String
}

input WaitlistSlotInput {
  spaceId: ID!

  """Início do horário reservado."""
  startsAt: DateTime!
}

input CreateBookingInput {
  spaceId: ID!

  """Início de um dos horários da grade."""
  startsAt: DateTime!

  """Observação (até 300)."""
  notes: String
}

input CheckInGuestInput {
  guestId: ID

  """Código do convite."""
  code: String
}

input CreateSpaceBlockInput {
  spaceId: ID!
  startsAt: DateTime!
  endsAt: DateTime!
  reason: String!

  """
  Cancela as reservas ativas do período (cada morador é avisado). Sem isso, a API diz quantas há.
  """
  cancelOverlapping: Boolean!
}

input BroadcastInput {
  title: String!
  body: String!
  audience: BroadcastAudience!
  targetGroup: UserGroup

  """Também envia por e-mail."""
  sendEmail: Boolean!
}

input CondominiumInput {
  name: String!

  """CNPJ (opcional)."""
  document: String
  city: String!

  """UF."""
  state: String!
}

input CreateUnitsInput {
  """Bloco ou torre."""
  block: String

  """Números e faixas: "101-104, 201"."""
  numbers: String!
}

input UpdateUnitInput {
  block: String
  number: String!
}

input CreateEnrollmentInviteInput {
  label: String!

  """Validade em dias (1 a 30)."""
  validDays: Int!
}

"""Dados do cadastro (formulário ou correção)."""
input EnrollmentDataInput {
  fullName: String!
  email: String!
  phone: String!

  """
  Unidade (obrigatória quando o condomínio tem unidades). Na aprovação, ausente mantém a escolhida.
  """
  unitId: ID

  """Complemento do endereço no condomínio ("casa dos fundos")."""
  unitComplement: String

  """Bloco ou torre digitado (quando o condomínio ainda não tem unidades)."""
  unitBlock: String

  """
  Número da casa ou apartamento digitado (quando o condomínio ainda não tem unidades). Na aprovação, ausente mantém o informado.
  """
  unitNumber: String
}

input SubmitEnrollmentInput {
  formToken: String!
  data: EnrollmentDataInput!

  """
  Morador (padrão) ou funcionário. Funcionário não informa unidade nem endereço.
  """
  applicant: EnrollmentApplicant

  """Aceite do uso dos dados (LGPD)."""
  consent: Boolean!

  """Foto de perfil em base64 (JPEG, PNG ou WebP, até 2 MB)."""
  photo: String
}

input LoginInput {
  """Usuário ou e-mail."""
  login: String!
  password: String!
}

input ChangePasswordInput {
  currentPassword: String!
  newPassword: String!
}

input UpdateMyProfileInput {
  name: String!
  email: String!

  """Telefone de contato (ausente: mantém; vazio: remove)."""
  phone: String
}

input VerifyRecoveryCodeInput {
  login: String!
  code: String!
}

input ResetPasswordInput {
  resetToken: String!
  newPassword: String!
}

input CreateUserInput {
  name: String!
  email: String!

  """Login: 3 a 32 caracteres (a-z, 0-9, ., -, _). Vazio: gerado do nome."""
  username: String

  """USER (morador) ou ADMIN (gestor)."""
  group: UserGroup!
  unitId: ID

  """Complemento do endereço no condomínio ("casa dos fundos")."""
  unitComplement: String

  """Telefone de contato."""
  phone: String
}

input UpdateUserInput {
  name: String
  email: String
  username: String
  group: UserGroup

  """Ausente: não muda. null: sem unidade."""
  unitId: ID

  """Complemento do endereço no condomínio ("casa dos fundos")."""
  unitComplement: String

  """Telefone de contato."""
  phone: String
}

input SetUserPermissionsInput {
  userId: ID!

  """true descarta as exceções e volta ao padrão do grupo."""
  useGroupDefaults: Boolean!

  """Conjunto completo desejado (ignorado com useGroupDefaults)."""
  permissions: [Permission!]
}

"""PushSubscription do navegador (PushManager)."""
input PushSubscriptionInput {
  endpoint: String!

  """Chave pública do aparelho (base64url)."""
  p256dh: String!

  """Segredo de autenticação (base64url)."""
  auth: String!
}

"""O formulário completo do espaço."""
input SpaceInput {
  name: String!
  kind: SpaceKind!
  description: String
  capacity: Int
  usageRules: String
  rules: SpaceRulesInput!
}

input SpaceRulesInput {
  openingHours: [OpeningHoursInput!]!
  slotMinutes: Int!
  minAdvanceHours: Int!
  maxAdvanceDays: Int!
  unitLimit: UnitLimitInput
  requiresApproval: Boolean!
  cancelUntilHours: Int!

  """Taxa de uso por reserva, em centavos (vazio: gratuito)."""
  feeCents: Int
  guests: GuestRulesInput!

  """Moradores podem reservar toda semana no mesmo horário."""
  recurringAllowed: Boolean!
}

input OpeningHoursInput {
  """0 = domingo … 6 = sábado."""
  weekday: Int!

  """"HH:MM"."""
  opensAt: String!

  """"HH:MM" ("24:00" = até meia-noite)."""
  closesAt: String!
}

input UnitLimitInput {
  count: Int!
  period: LimitPeriod!
}

input GuestRulesInput {
  """Quem reserva pode levar convidados."""
  allowed: Boolean!

  """Máximo de convidados por reserva (vazio: sem limite)."""
  max: Int

  """A portaria exige o documento de cada convidado."""
  documentRequired: Boolean!
}

input SupportRequestInput {
  category: SupportCategory!
  subject: String!
  message: String!
}

input RecordSupportContributionInput {
  """Nome do apoiador. Um nome que já está na lista soma a esse apoiador."""
  name: String!

  """Falso: o ranking mostra "Apoiador anônimo" no lugar do nome."""
  showName: Boolean!

  """Valor em centavos."""
  amountCents: Int!

  """Dia em que o apoio chegou (YYYY-MM-DD)."""
  receivedOn: String!

  """Observação interna (não aparece no ranking)."""
  note: String
}

input UpdateSupporterInput {
  name: String!

  """Falso: aparece como "Apoiador anônimo"."""
  showName: Boolean!
}
